[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zpaper"
version = "0.1.0"
description = "Literature management & reading assistant for Claude Code"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pymupdf>=1.23.0",
    "requests>=2.28.0",
]

[project.scripts]
paper = "zpaper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
